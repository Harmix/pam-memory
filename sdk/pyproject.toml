[project]
name = "pam-sdk"
version = "0.1.0"
description = "PAM Python SDK for company memory retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
